name: Build closures feed

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC — adjust as you like
  workflow_dispatch: {}    # adds a manual "Run workflow" button on GitHub

permissions:
  contents: write   # lets this workflow commit the updated feed back to the repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run adapter
        id: run-adapter
        continue-on-error: true
        env:
          NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
          RIDB_API_KEY: ${{ secrets.RIDB_API_KEY }}
        run: node index.js --config config.json

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add closures-feed.json
          if git diff --quiet --cached; then
            echo "No changes to commit."
          else
            git commit -m "Update closures feed [automated]"
            git push origin HEAD:main
          fi

      - name: Fail the run if the adapter had errors (after committing what succeeded)
        if: steps.run-adapter.outcome == 'failure'
        run: |
          echo "Some sources failed this run — see the 'Run adapter' step's log above for which ones."
          echo "Whatever succeeded was still committed; this just keeps the run visibly red so failures don't go unnoticed."
          exit 1
